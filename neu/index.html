<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schweigfried ist umgezogen</title>
<meta http-equiv="refresh" content="3; url=../">
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f5bd8; color: #15111d;
         font: 18px/1.5 "Comic Neue", "Comic Sans MS", system-ui, sans-serif; }
  main { background: #fff; border: 3px solid #15111d; border-radius: 6px; box-shadow: 6px 6px 0 #15111d; padding: 22px 26px; margin: 16px; max-width: 30em; }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.15; }
  p { margin: 0 0 10px; }
  a { color: #12318c; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Schweigfried ist umgezogen</h1>
  <p>Die neue Version läuft jetzt unter der Hauptadresse. Du wirst gleich weitergeleitet.</p>
  <p><a href="../">Zu Schweigfried</a></p>
  <p lang="en">Schweigfried has moved. <a href="../">Open the game</a></p>
</main>
<script>
  // Die Vorschau unter /neu/ hatte einen eigenen Offline-Speicher: abmelden und aufräumen, dann zur Hauptadresse.
  // Spielstand und Modelldateien gehören der ganzen Website und bleiben erhalten.
  (async function () {
    try {
      if ('serviceWorker' in navigator) {
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(function (r) { return /\/neu\/$/.test(new URL(r.scope).pathname); })
          .map(function (r) { return r.unregister(); }));
      }
      if (window.caches) {
        var keys = await caches.keys();
        await Promise.all(keys.filter(function (k) { return /^schweigfried-shell-.*@.*\/neu\/$/.test(k); })
          .map(function (k) { return caches.delete(k); }));
      }
    } catch (e) { /* weiterleiten klappt trotzdem */ }
    location.replace('../' + location.search + location.hash);
  })();
</script>
</body>
</html>
